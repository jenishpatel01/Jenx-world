<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>JENX World · Inbox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 3 22 20H2Z' fill='%235df0a8'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#04060f; --ink:#f3f6ff; --muted:#9aa6c4; --muted-2:#6b7796;
  --line:rgba(150,175,230,.12); --line-strong:rgba(150,175,230,.22);
  --accent:#5df0a8; --accent-2:#2fd38a; --accent-ink:#032018;
  --glass:rgba(12,18,38,.7); --glass-2:rgba(16,24,48,.8);
  --danger:#ff8f8f; --warn:#ffd27a; --font:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:radial-gradient(90% 60% at 50% -10%,#0b1636 0%,var(--bg) 60%) fixed;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:900px;margin:0 auto;padding:24px 20px 80px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 0 28px}
.brand{display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:18px;letter-spacing:.14em;text-transform:uppercase}
.brand b{color:var(--accent)} .brand i{font-style:normal;color:var(--accent);font-size:13px}
.brand small{font-size:11px;font-weight:600;letter-spacing:.16em;color:var(--muted-2);margin-left:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 14px var(--font);padding:10px 18px;border-radius:999px;border:1px solid var(--line-strong);background:rgba(255,255,255,.05);color:var(--ink);cursor:pointer;transition:background .2s,transform .15s}
.btn:hover{background:rgba(255,255,255,.1);transform:translateY(-1px)}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{color:var(--accent-ink);border-color:transparent;background:linear-gradient(180deg,var(--accent),var(--accent-2))}
.btn.danger{color:var(--danger)} .btn.sm{padding:7px 13px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:progress}
.card{background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

/* lock screen */
.lock{max-width:440px;margin:12vh auto 0;padding:34px 28px;text-align:center}
.lock h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.lock p{margin-top:10px;color:var(--muted);font-size:15px;line-height:1.55}
.lock form{margin-top:24px;display:flex;flex-direction:column;gap:14px;text-align:left}
.lock input[type=password],.lock input[type=text]{font:inherit;font-size:15px;color:var(--ink);background:rgba(4,6,15,.6);border:1px solid var(--line-strong);border-radius:12px;padding:13px 14px;width:100%}
.lock input:focus{outline:none;border-color:var(--accent)}
.remember{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--muted)}
.err{display:none;margin-top:14px;font-size:14px;color:var(--danger);background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.25);border-radius:12px;padding:11px 13px}
.err.show{display:block}

/* toolbar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font:600 13px var(--font);padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.tab span{margin-left:6px;opacity:.7}
.tab.on{color:var(--accent);border-color:rgba(93,240,168,.35);background:rgba(93,240,168,.08)}
.search{font:inherit;font-size:14px;color:var(--ink);background:rgba(4,6,15,.6);border:1px solid var(--line-strong);border-radius:999px;padding:9px 16px;min-width:200px;flex:1;max-width:280px}
.search:focus{outline:none;border-color:var(--accent)}
.tools{display:flex;gap:8px;align-items:center}

/* messages */
.list{display:flex;flex-direction:column;gap:14px}
.msg{padding:20px 22px}
.msg.new{border-color:rgba(93,240,168,.3)}
.msg-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.who{font-size:17px;font-weight:700}
.who a{display:inline-block;margin-top:3px;font-size:14px;font-weight:500;color:var(--accent)}
.when{font-size:12.5px;color:var(--muted-2);text-align:right}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid var(--line-strong);color:var(--muted)}
.chip.s-new{color:var(--accent);border-color:rgba(93,240,168,.3);background:rgba(93,240,168,.08)}
.chip.s-replied{color:var(--warn);border-color:rgba(255,210,122,.3);background:rgba(255,210,122,.07)}
.body{margin-top:14px;font-size:15.5px;line-height:1.65;color:#d6dcee;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.acts{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.acts select{font:600 13px var(--font);color:var(--ink);background:rgba(4,6,15,.6);border:1px solid var(--line-strong);border-radius:999px;padding:7px 12px}
.acts select option{background:#0b1020}
.sp{flex:1}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#0d1530;border:1px solid var(--line-strong);border-radius:999px;padding:10px 18px;font-size:14px;transition:.25s}
.toast.show{opacity:1;transform:translateX(-50%)}
[hidden]{display:none !important}
@media(max-width:560px){.when{text-align:left}.acts .sp{display:none}.search{max-width:none;width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand"><i>▲</i>JENX <b>World</b><small>INBOX</small></span>
    <span class="tools" id="top-tools" hidden>
      <button class="btn sm" id="refresh" type="button">↻ Refresh</button>
      <button class="btn sm" id="lock-btn" type="button">Lock</button>
    </span>
  </header>

  <!-- lock screen -->
  <section class="card lock" id="lock">
    <h1>Private inbox</h1>
    <p>Enter your inbox key to read the messages people sent you through JENX World.</p>
    <form id="lock-form" autocomplete="off">
      <input type="password" id="key" placeholder="jx-…" aria-label="Inbox key" required spellcheck="false" autocomplete="off" />
      <label class="remember"><input type="checkbox" id="remember" /> Remember on this device</label>
      <button class="btn primary" id="unlock" type="submit">Unlock inbox</button>
    </form>
    <div class="err" id="lock-err" role="alert"></div>
  </section>

  <!-- inbox -->
  <main id="inbox" hidden>
    <div class="bar">
      <div class="tabs" id="tabs"></div>
      <input class="search" id="search" type="search" placeholder="Search name, email, message…" aria-label="Search messages" />
    </div>
    <div class="list" id="list"></div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const SUPABASE_URL = 'https://pfvyljatsggtnmcvkhho.supabase.co';
const SUPABASE_KEY = 'sb_publishable_h2ryXu3E_CsMM7I9RZ8Dqg_Mct3Situ';
const OWNER_EMAIL = 'jenishgajera8@gmail.com';
const LS = 'jenx-inbox-key';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let KEY = '', MSGS = [], FILTER = 'all', QUERY = '';

function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2200); }

async function rpc(fn, args){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_key: KEY, ...args }),
  });
  if (!r.ok) {
    let body = {}; try { body = await r.json(); } catch {}
    const e = new Error(body.message || ('HTTP ' + r.status)); e.status = r.status; e.code = body.code; throw e;
  }
  const txt = await r.text();
  return txt ? JSON.parse(txt) : null;
}

function showLock(msg){
  $('inbox').hidden = true; $('top-tools').hidden = true; $('lock').hidden = false;
  const e = $('lock-err'); if (msg) { e.textContent = msg; e.classList.add('show'); } else e.classList.remove('show');
}

async function load(){
  try { MSGS = await rpc('admin_list_messages', {}); }
  catch (e) {
    if (e.code === '28000' || /invalid key/i.test(e.message)) { try { localStorage.removeItem(LS); } catch {} KEY = ''; return showLock('That key is not right.'); }
    if (e.code === 'PGRST202' || e.status === 404) return showLock('Inbox setup is not finished yet — run JENX-inbox-setup.sql in Supabase first.');
    return showLock('Could not load messages: ' + e.message);
  }
  $('lock').hidden = true; $('inbox').hidden = false; $('top-tools').hidden = false;
  render();
}

const fmt = iso => new Date(iso).toLocaleString(undefined, { day:'numeric', month:'short', year:'numeric', hour:'numeric', minute:'2-digit' });

function render(){
  const counts = { all: MSGS.length, new:0, read:0, replied:0, archived:0 };
  MSGS.forEach(m => counts[m.status]++);
  $('tabs').innerHTML = ['all','new','read','replied','archived'].map(k =>
    `<button class="tab${FILTER===k?' on':''}" data-f="${k}" type="button">${k[0].toUpperCase()+k.slice(1)}<span>${counts[k]}</span></button>`).join('');
  const q = QUERY.trim().toLowerCase();
  const rows = MSGS.filter(m => (FILTER==='all' || m.status===FILTER) &&
    (!q || [m.name,m.email,m.purpose,m.message].some(v => String(v).toLowerCase().includes(q))));
  if (!rows.length){ $('list').innerHTML = `<div class="card empty">${MSGS.length ? 'No messages match.' : 'No messages yet — they will show up here.'}</div>`; return; }
  $('list').innerHTML = rows.map(m => {
    const subj = encodeURIComponent('Re: ' + m.purpose + ' — JENX World');
    const quoted = String(m.message).split('\n').map(l => '> ' + l).join('\n');
    const body = encodeURIComponent(`Hi ${m.name.split(' ')[0]},\n\n\n\n—\nJenish · JENX World\n\nOn ${fmt(m.created_at)} you wrote:\n${quoted}`);
    const gmail = `https://mail.google.com/mail/?view=cm&fs=1&authuser=${encodeURIComponent(OWNER_EMAIL)}&to=${encodeURIComponent(m.email)}&su=${subj}&body=${body}`;
    return `
    <article class="card msg ${m.status}" data-id="${esc(m.id)}">
      <div class="msg-top">
        <div class="who">${esc(m.name)}<br><a href="mailto:${esc(m.email)}">${esc(m.email)}</a></div>
        <div class="when">${esc(fmt(m.created_at))}</div>
      </div>
      <div class="chips"><span class="chip">${esc(m.purpose)}</span><span class="chip s-${esc(m.status)}">${esc(m.status)}</span></div>
      <div class="body">${esc(m.message)}</div>
      <div class="acts">
        <a class="btn primary sm" href="${gmail}" target="_blank" rel="noopener" data-reply>Reply in Gmail</a>
        <a class="btn sm" href="mailto:${esc(m.email)}?subject=${subj}&body=${body}" data-reply>Mail app</a>
        <button class="btn sm" data-copy type="button">Copy email</button>
        <span class="sp"></span>
        <select data-status aria-label="Status">${['new','read','replied','archived'].map(s => `<option${s===m.status?' selected':''}>${s}</option>`).join('')}</select>
        <button class="btn sm danger" data-del type="button">Delete</button>
      </div>
    </article>`;
  }).join('');
}

async function setStatus(id, status){
  try { await rpc('admin_set_status', { p_id: id, p_status: status }); const m = MSGS.find(x => x.id === id); if (m) m.status = status; render(); }
  catch (e) { toast('Could not update: ' + e.message); }
}

$('lock-form').addEventListener('submit', async e => {
  e.preventDefault();
  KEY = $('key').value.trim();
  if (!KEY) return;
  $('unlock').disabled = true; $('unlock').textContent = 'Checking…';
  await load();
  $('unlock').disabled = false; $('unlock').textContent = 'Unlock inbox';
  $('key').value = '';
  if (!$('lock').hidden) { $('key').focus(); return; }
  try { if ($('remember').checked) localStorage.setItem(LS, KEY); } catch {}
});
$('lock-btn').addEventListener('click', () => { try { localStorage.removeItem(LS); } catch {} KEY = ''; MSGS = []; showLock(); });
$('refresh').addEventListener('click', async () => { await load(); toast('Refreshed'); });
$('search').addEventListener('input', e => { QUERY = e.target.value; render(); });
$('tabs').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (b) { FILTER = b.dataset.f; render(); } });
$('list').addEventListener('click', async e => {
  const card = e.target.closest('.msg'); if (!card) return;
  const id = card.dataset.id, m = MSGS.find(x => x.id === id);
  if (e.target.closest('[data-copy]')) { try { await navigator.clipboard.writeText(m.email); toast('Email copied'); } catch { toast(m.email); } }
  else if (e.target.closest('[data-reply]')) { if (m.status === 'new' || m.status === 'read') setTimeout(() => setStatus(id, 'replied'), 400); }
  else if (e.target.closest('[data-del]')) {
    if (!confirm(`Delete the message from ${m.name}? This cannot be undone.`)) return;
    try { await rpc('admin_delete_message', { p_id: id }); MSGS = MSGS.filter(x => x.id !== id); render(); toast('Deleted'); }
    catch (err) { toast('Could not delete: ' + err.message); }
  }
});
$('list').addEventListener('change', e => { const s = e.target.closest('[data-status]'); if (s) setStatus(s.closest('.msg').dataset.id, s.value); });

try { const saved = localStorage.getItem(LS); if (saved) { KEY = saved; load(); } } catch {}
</script>
</body>
</html>
